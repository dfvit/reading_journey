    const STORAGE_KEY = "exact_214_catalog_completed_v1";
    let completedBooks = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[\"b1\", \"b2\"]"));
    let selectedYear = "all";
    let activeGenre = "all";
    let searchQuery = "";

    function genreBadgeColor(genre) {
      switch(genre) {
        case 'Sci-Fi': return 'bg-blue-900/50 text-blue-300 border-blue-700/50';
        case 'Fantasy': return 'bg-purple-900/50 text-purple-300 border-purple-700/50';
        case 'LitRPG': return 'bg-emerald-900/50 text-emerald-300 border-emerald-700/50';
        case 'Non-Fiction': return 'bg-amber-900/50 text-amber-300 border-amber-700/50';
        case 'Historical': return 'bg-rose-900/50 text-rose-300 border-rose-700/50';
        default: return 'bg-slate-800 text-slate-300 border-slate-700';
      }
    }

    function toggleBook(id) {
      if (completedBooks.has(id)) {
        completedBooks.delete(id);
      } else {
        completedBooks.add(id);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(completedBooks)));
      render();
    }

    function selectYear(yr) {
      selectedYear = yr;
      document.querySelectorAll('.year-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('text-slate-400');
      });
      event.target.classList.add('bg-indigo-600', 'text-white');
      event.target.classList.remove('text-slate-400');
      render();
    }

    function filterGenre(genre) {
      activeGenre = genre;
      document.querySelectorAll('.genre-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('bg-slate-800', 'text-slate-300');
      });
      event.target.classList.add('bg-indigo-600', 'text-white');
      event.target.classList.remove('bg-slate-800', 'text-slate-300');
      render();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.toLowerCase();
      render();
    }

    function render() {
      const grid = document.getElementById('books-grid');
      grid.innerHTML = '';

      const filtered = exactCatalog.filter(b => {
        const matchYear = selectedYear === 'all' || b.year === selectedYear;
        const matchGenre = activeGenre === 'all' || b.genre === activeGenre;
        const matchSearch = b.title.toLowerCase().includes(searchQuery) || b.author.toLowerCase().includes(searchQuery) || b.series.toLowerCase().includes(searchQuery);
        return matchYear && matchGenre && matchSearch;
      });

      filtered.forEach(book => {
        const isDone = completedBooks.has(book.id);
        const card = document.createElement('div');
        card.onclick = () => toggleBook(book.id);
        card.className = `cursor-pointer p-4 rounded-xl border transition-all ${isDone ? 'bg-slate-900/40 border-indigo-900/40 opacity-50' : 'bg-slate-900 border-slate-800 hover:border-indigo-500/50'} flex justify-between items-center gap-3`;

        card.innerHTML = `
          <div class="flex-1 text-left">
            <div class="font-semibold text-sm ${isDone ? 'line-through text-slate-400' : 'text-slate-100'}">${book.title}</div>
            <div class="text-xs text-slate-400">${book.author} • <span class="text-indigo-400">${book.month} (Year ${book.year})</span></div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] px-2 py-0.5 rounded border ${genreBadgeColor(book.genre)}">${book.genre}</span>
            <input type="checkbox" ${isDone ? 'checked' : ''} class="w-4 h-4 accent-indigo-500 rounded cursor-pointer pointer-events-none" />
          </div>
        `;
        grid.appendChild(card);
      });

      // Metrics
      const totalDone = completedBooks.size;
      const totalPagesRead = exactCatalog.filter(b => completedBooks.has(b.id)).reduce((acc, b) => acc + b.pages, 0);
      const grandTotalPages = exactCatalog.reduce((acc, b) => acc + b.pages, 0);

      document.getElementById('books-completed').innerText = `${totalDone} / 214`;
      document.getElementById('pages-completed').innerText = `${totalPagesRead.toLocaleString()} / ${grandTotalPages.toLocaleString()}`;

      const pct = Math.round((totalDone / 214) * 100);
      document.getElementById('progress-percent').innerText = `${pct}%`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    render();
  </script>
